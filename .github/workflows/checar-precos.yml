name: Checar preços

on:
  schedule:
    - cron: "7 * * * *" # a cada 1h (minuto 7 para fugir do pico do minuto 0)
  workflow_dispatch:
    inputs:
      testar_alerta:
        description: "Só envia um alerta de teste para este id (ex.: kb-04a445). Vazio = checagem normal."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: checar-precos
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Pichau fica de fora: a Cloudflare dela devolve 403 para os IPs do GitHub
      # (testado em out/2026). Do PC de casa funciona; use "Testar preço" no painel.
      - name: Checar preços (Mercado Livre, Kabum, Terabyte)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTAR_ALERTA: ${{ inputs.testar_alerta }}
        run: |
          if [ -n "$TESTAR_ALERTA" ]; then
            python -m scraper.main --testar-alerta "$TESTAR_ALERTA"
          else
            python -m scraper.main --excluir amazon,pichau
          fi
